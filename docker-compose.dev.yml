# Database only. Run the app natively with `npm run dev` against this.
# Port 5433 avoids clashing with a Postgres already installed on the host.
services:
  db:
    image: postgres:18-alpine
    container_name: printbench-dev-db
    environment:
      POSTGRES_USER: printbench
      POSTGRES_PASSWORD: printbench
      POSTGRES_DB: printbench
    ports:
      - '5433:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U printbench -d printbench']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage, for exercising the S3 backend locally. Not started
  # by default — bring it up with:
  #   docker compose -f docker-compose.dev.yml --profile s3 up -d
  # then run `npm run verify:s3`, which creates its bucket if it is missing.
  #
  # SeaweedFS rather than MinIO: MinIO no longer publishes images that can be
  # pulled without an account, so that service stopped starting for anyone.
  # Its S3 API listens on 8333 and is published on 9000, where MinIO used to
  # be, so the verify script's default endpoint and the docs did not change.
  # The access key and secret are both `printbench` (docker/dev-s3.json).
  s3:
    image: chrislusf/seaweedfs:4.55
    container_name: printbench-dev-s3
    profiles: ['s3']
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '9000:8333'
    volumes:
      - s3data-dev:/data
      - ./docker/dev-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata-dev:
  s3data-dev:
