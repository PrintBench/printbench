# Database only. Run the app natively with `npm run dev` against this.
# Port 5433 avoids clashing with a Postgres already installed on the host.
services:
  db:
    image: postgres:18-alpine
    container_name: printmanager-dev-db
    environment:
      POSTGRES_USER: printmanager
      POSTGRES_PASSWORD: printmanager
      POSTGRES_DB: printmanager
    ports:
      - '5433:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U printmanager -d printmanager']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
