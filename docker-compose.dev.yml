# Database only. Run the app natively with `npm run dev` against this.
# Port 5433 avoids clashing with a Postgres already installed on the host.
services:
  db:
    image: postgres:18-alpine
    container_name: printbench-dev-db
    environment:
      POSTGRES_USER: printbench
      POSTGRES_PASSWORD: printbench
      POSTGRES_DB: printbench
    ports:
      - '5433:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U printbench -d printbench']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage, for exercising the S3 backend locally. Not started
  # by default — bring it up with:
  #   docker compose -f docker-compose.dev.yml --profile s3 up -d
  # then run `npm run verify:s3`.
  minio:
    image: minio/minio:latest
    container_name: printbench-dev-minio
    profiles: ['s3']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: printbench
      MINIO_ROOT_PASSWORD: printbench
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata-dev:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
  miniodata-dev:
