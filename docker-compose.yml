# Production stack. `docker compose up` must reach a working login with no
# manual steps — that is the bar this project exists to clear.
#
# Deployed via Coolify: it proxies to the `nginx` service.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-printbench}
    volumes:
      # Postgres 18 expects the mount at /var/lib/postgresql, not /data beneath it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-printbench}']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ['web']
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-printbench}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-printbench}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      APP_URL: ${APP_URL:-}
      FILE_DELIVERY: ${FILE_DELIVERY:-xaccel}
      DATA_DIR: /data
      # Where an admin may point a library. Confines the folder picker, so
      # browsing cannot wander outside what is mounted.
      LIBRARY_ROOTS: /libraries:/data/libraries
      # Must match the internal locations in docker/nginx.conf.
      ACCEL_MOUNTS: /_protected/library/=/libraries,/_protected/managed/=/data/libraries
    volumes:
      - previews:/data
      # Existing collections are read-only by default. Set LIBRARY_READ_ONLY=false
      # only when PrintBench should be allowed to save metadata sidecars.
      # Long syntax keeps interpolation colons out of Coolify's volume parser.
      - type: bind
        source: ${LIBRARY_PATH:-./libraries}
        target: /libraries
        read_only: ${LIBRARY_READ_ONLY:-true}
    healthcheck:
      # The standalone server binds the container interface, not loopback.
      # Double-dollar defers hostname expansion until the check runs in Docker.
      test: ['CMD-SHELL', 'curl -fsS http://$$(hostname):3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ['worker']
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-printbench}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-printbench}
      APP_URL: ${APP_URL:-}
      DATA_DIR: /data
      LIBRARY_ROOTS: /libraries:/data/libraries
      WORKER_MEMORY_LOG: ${WORKER_MEMORY_LOG:-0}
    volumes:
      - previews:/data
      - type: bind
        source: ${LIBRARY_PATH:-./libraries}
        target: /libraries
        read_only: ${LIBRARY_READ_ONLY:-true}

    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '5', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    build: { context: ., dockerfile: docker/nginx.Dockerfile }
    restart: unless-stopped
    depends_on: [web, worker]
    expose:
      - '80'
    volumes:
      - previews:/data:ro
      - type: bind
        source: ${LIBRARY_PATH:-./libraries}
        target: /libraries
        read_only: true
    healthcheck:
      # Check the proxy and the web/database readiness endpoint together.
      test: ['CMD', 'wget', '-q', '-T', '5', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
  previews:
