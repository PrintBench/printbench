# Fronts the app so multi-gigabyte model downloads never pass through Node.
#
# The app authorizes a download, then returns an empty response carrying
# X-Accel-Redirect. nginx serves the file itself with sendfile and full Range
# support, so a user pulling an 8GB library does not stall page rendering.
# Under Coolify, Traefik proxies to this container.

upstream web    { server web:3000;    keepalive 32; }
upstream worker { server worker:3001; keepalive 16; }

server {
    listen 80;
    server_name _;

    # Model files are large; never buffer them to disk first.
    client_max_body_size 0;
    proxy_http_version   1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Only reachable via X-Accel-Redirect from the app — never directly.
    # This is what makes authorization non-bypassable.
    location /_protected/ {
        internal;
        alias /libraries/;
        sendfile           on;
        sendfile_max_chunk 1m;
        tcp_nopush         on;
        aio                threads;
    }

    location /_previews/ {
        internal;
        alias /data/previews/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Resumable uploads and streaming ZIPs are handled by the worker process,
    # so a big archive build cannot degrade the web tier.
    location /api/upload/ {
        proxy_pass http://worker;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/download/ {
        proxy_pass http://worker;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://web;
        proxy_buffering off;
    }
}
