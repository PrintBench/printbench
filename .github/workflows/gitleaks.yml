name: Gitleaks

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          version=8.30.1
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${version}_linux_x64.tar.gz"
          scan_dir=$(mktemp -d)
          curl --fail --silent --show-error --location --output "$scan_dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          (
            cd "$scan_dir"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
            tar -xzf "$archive" gitleaks
          )
          revision_range=HEAD
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            revision_range="${BASE_SHA}..HEAD"
          fi
          "$scan_dir/gitleaks" git --log-opts="--diff-merges=first-parent $revision_range" \
            --redact --verbose --no-banner --no-color .
