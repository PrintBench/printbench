# Validate the tagged commit before granting publication permissions.
# See docs/releasing.md for the checklist, prereleases and recovery.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Validate tag and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      notes: ${{ steps.meta.outputs.notes }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare release metadata
        id: meta
        run: node scripts/release-metadata.mjs "$GITHUB_REF_NAME"

  verify:
    name: Validate tagged commit
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish container image
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile lives under docker/, but the context is the repo
          # root: the build copies every workspace package.
          file: docker/Dockerfile
          push: true
          # arm64 matters for Apple Silicon and for the cheaper ARM instances
          # most small self-hosted deployments run on.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ needs.prepare.outputs.tags }}
          labels: |
            org.opencontainers.image.title=PrintBench
            org.opencontainers.image.description=Self-hosted web app for managing and finding your 3D print files (STL, 3MF, OBJ, PLY)
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Attest build provenance
        # Lets anyone verify the published image was built from this repository
        # by this workflow: gh attestation verify oci://... --repo <owner>/<repo>
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag \
            "${flags[@]}"
