# Validate the tagged commit before granting publication permissions.
# See docs/releasing.md for the checklist, prereleases and recovery.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Validate tag and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      nginx_image: ${{ steps.meta.outputs.nginx_image }}
      notes: ${{ steps.meta.outputs.notes }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tags: ${{ steps.meta.outputs.tags }}
      nginx_tags: ${{ steps.meta.outputs.nginx_tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare release metadata
        id: meta
        run: node scripts/release-metadata.mjs "$GITHUB_REF_NAME"

  verify:
    name: Validate tagged commit
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package-clipper:
    name: Package browser clipper
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build browser clipper
        run: |
          npm ci
          npm run build:clipper
          mkdir -p "$RUNNER_TEMP/browser-clipper"
          cp apps/clipper/dist/printbench-clipper-chrome-edge.zip "$RUNNER_TEMP/browser-clipper/"
      - name: Sign Firefox clipper for self-distribution
        if: needs.prepare.outputs.prerelease != 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo "::warning::Firefox signing credentials are missing. See docs/releasing.md to attach the signed XPI."
            exit 0
          fi
          npx --yes web-ext@10.8.0 sign --channel=unlisted \
            --source-dir apps/clipper/dist/firefox \
            --artifacts-dir "$RUNNER_TEMP/clipper-signed" \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv "$RUNNER_TEMP"/clipper-signed/*.xpi "$RUNNER_TEMP/browser-clipper/printbench-clipper-firefox.xpi"
      - uses: actions/upload-artifact@v7
        with:
          name: browser-clipper
          path: ${{ runner.temp }}/browser-clipper/
          if-no-files-found: error

  publish:
    name: Publish container images and release assets
    needs: [prepare, verify, package-clipper]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: browser-clipper
          path: ${{ runner.temp }}/browser-clipper

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile lives under docker/, but the context is the repo
          # root: the build copies every workspace package.
          file: docker/Dockerfile
          push: true
          # arm64 matters for Apple Silicon and for the cheaper ARM instances
          # most small self-hosted deployments run on.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ needs.prepare.outputs.tags }}
          labels: |
            org.opencontainers.image.title=PrintBench
            org.opencontainers.image.description=Self-hosted web app for managing and finding your 3D print files (STL, 3MF, OBJ, PLY)
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Attest build provenance
        # Lets anyone verify the published image was built from this repository
        # by this workflow: gh attestation verify oci://... --repo <owner>/<repo>
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Build and push nginx
        id: nginx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/nginx.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.prepare.outputs.nginx_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Attest nginx build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.prepare.outputs.nginx_image }}
          subject-digest: ${{ steps.nginx.outputs.digest }}
          push-to-registry: true

      - name: Package the versioned Compose file
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APP_IMAGE: ${{ needs.prepare.outputs.image }}
          NGINX_IMAGE: ${{ needs.prepare.outputs.nginx_image }}
        run: |
          compose_file="$RUNNER_TEMP/compose.yaml"
          sed -e "s|ghcr\.io/printbench/printbench:latest|$APP_IMAGE:$VERSION|" \
              -e "s|ghcr\.io/printbench/printbench-nginx:latest|$NGINX_IMAGE:$VERSION|" \
              compose.quickstart.yaml > "$compose_file"
          images=$(docker compose -f "$compose_file" config --images)
          grep -Fxq "$APP_IMAGE:$VERSION" <<< "$images"
          grep -Fxq "$NGINX_IMAGE:$VERSION" <<< "$images"

      - name: Verify the published image manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APP_IMAGE: ${{ needs.prepare.outputs.image }}
          NGINX_IMAGE: ${{ needs.prepare.outputs.nginx_image }}
        run: |
          for image in "$APP_IMAGE" "$NGINX_IMAGE"; do
            if ! docker buildx imagetools inspect --raw "$image:$VERSION" | jq -e \
              '[.manifests[].platform | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])' > /dev/null; then
              echo "::error::$image:$VERSION is missing a readable linux/amd64 or linux/arm64 manifest."
              exit 1
            fi
          done

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          fi
          assets=("$RUNNER_TEMP/compose.yaml" "$RUNNER_TEMP/browser-clipper/printbench-clipper-chrome-edge.zip")
          if [[ -f "$RUNNER_TEMP/browser-clipper/printbench-clipper-firefox.xpi" ]]; then
            assets+=("$RUNNER_TEMP/browser-clipper/printbench-clipper-firefox.xpi")
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag \
            "${flags[@]}"
