name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: printbench
          POSTGRES_PASSWORD: printbench
          POSTGRES_DB: printbench
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U printbench"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://printbench:printbench@localhost:5433/printbench

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build -w @pb/web

      - name: Verify authenticated surface end to end
        run: |
          npm run start -w @pb/web &
          npx wait-on http://localhost:3000/api/health --timeout 60000
          npm run verify:phase1
        env:
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          APP_URL: http://localhost:3000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
