name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: printbench
          POSTGRES_PASSWORD: printbench
          POSTGRES_DB: printbench
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U printbench"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://printbench:printbench@localhost:5433/printbench

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Release preparation tests
        run: npm run test:release

      - name: Apply migrations
        run: npm run db:migrate

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build web
        run: npm run build -w @pb/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser and worker flows
        run: npm run verify:smoke

      - name: Save smoke failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
