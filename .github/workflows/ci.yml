name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_call:
    inputs:
      full_ci:
        description: Run the full checks for a reusable workflow call
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Each main push checks its own diff, so a docs push must leave earlier builds running.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !inputs.full_ci }}
    runs-on: ubuntu-latest
    outputs:
      skip_full_ci: ${{ steps.diff.outputs.skip_full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for app, build or Docker changes
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Compare the tested merge commit with its base parent.
            BASE_SHA=HEAD^1
          fi

          # Unknown paths and unavailable comparisons both get the full checks.
          if [[ -n "$BASE_SHA" ]] && git diff --quiet --no-renames "$BASE_SHA" HEAD -- . \
            ':(exclude)docs' \
            ':(exclude)screenshots' \
            ':(exclude).agents' \
            ':(exclude).claude' \
            ':(exclude).codex' \
            ':(exclude).github/ISSUE_TEMPLATE' \
            ':(exclude).github/PULL_REQUEST_TEMPLATE.md' \
            ':(exclude).github/dependabot.yml' \
            ':(exclude).git-blame-ignore-revs' \
            ':(exclude).gitignore' \
            ':(exclude).nvmrc' \
            ':(exclude)CLAUDE.md' \
            ':(exclude)CODE_OF_CONDUCT.md' \
            ':(exclude)CONTRIBUTING.md' \
            ':(exclude)LICENSE' \
            ':(exclude)README.md' \
            ':(exclude)SECURITY.md' \
            ':(exclude)SUPPORT.md'; then
            echo 'skip_full_ci=true' >> "$GITHUB_OUTPUT"
            echo 'Only repository documentation or local tooling changed.'
          fi

  verify:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: printbench
          POSTGRES_PASSWORD: printbench
          POSTGRES_DB: printbench
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U printbench"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://printbench:printbench@localhost:5433/printbench

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:clipper

      - name: Release preparation tests
        run: npm run test:release

      - name: Apply migrations
        run: npm run db:migrate

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build web
        run: npm run build -w @pb/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser and worker flows
        run: npm run verify:smoke

      - name: Save smoke failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip_full_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: printbench-ci:app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify clean local Compose startup and recreation
        env:
          PRINTBENCH_IMAGE: printbench-ci:app
          PRINTBENCH_NGINX_IMAGE: printbench-ci:nginx
        run: |
          docker build -t "$PRINTBENCH_NGINX_IMAGE" -f docker/nginx.Dockerfile .
          quickstart_dir=$(mktemp -d)
          cp compose.quickstart.yaml "$quickstart_dir/compose.yaml"
          cd "$quickstart_dir"
          trap 'docker compose down --volumes' EXIT

          docker compose up -d --wait --wait-timeout 180 || { docker compose logs; exit 1; }
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/setup -o /dev/null
          credentials_before=$(docker compose exec -T web sha256sum /run/printbench/postgres-password /run/printbench/auth-secret)

          docker compose down
          docker compose up -d --wait --wait-timeout 180 || { docker compose logs; exit 1; }
          credentials_after=$(docker compose exec -T web sha256sum /run/printbench/postgres-password /run/printbench/auth-secret)
          test "$credentials_before" = "$credentials_after"
          curl -fsS http://localhost:8080/api/health
