name: GitLab mirror

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'PrintBench/printbench'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch GitHub branches and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source_repo="$RUNNER_TEMP/mirror.git"
          git init --bare --quiet "$source_repo"
          GITHUB_AUTH_HEADER="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GITHUB_AUTH_HEADER
          git -C "$source_repo" \
            --config-env="http.${GITHUB_SERVER_URL}/.extraheader=GITHUB_AUTH_HEADER" \
            fetch --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

      - name: Push branches and tags to GitLab
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          if [[ -z "$GITLAB_DEPLOY_KEY" ]]; then
            echo '::error::Add GITLAB_DEPLOY_KEY to the repository Actions secrets.'
            exit 1
          fi

          umask 077
          key_file="$RUNNER_TEMP/gitlab-mirror-key"
          known_hosts="$RUNNER_TEMP/gitlab-known-hosts"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$GITLAB_DEPLOY_KEY" > "$key_file"

          # https://docs.gitlab.com/user/gitlab_com/#ssh-known_hosts-entries
          printf '%s\n' 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' > "$known_hosts"

          GIT_SSH_COMMAND="ssh -i '$key_file' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts'" \
            git -C "$RUNNER_TEMP/mirror.git" push --atomic git@gitlab.com:printbench/printbench.git \
              'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
